name: Release WP Plugin
description: Bump version string in package files and create a release.

inputs:
  php-version:
    description: PHP Version
    default: 7.4
    required: false

  node-version:
    description: Node Version
    default: 16.13.2
    required: false

  skip-release:
    description: Skip creating a GitHub release
    default: false
    required: false

  tag-branch:
    description: The branch that tags are created from. Can be supplied if different from the default branch. Will improve accuracy of the tag calculation process.
    required: false

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup PHP with composer v2
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        tools: composer:v2

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: "5.x"

    - name: Sync branch
      run: |
        BRANCH="${GITHUB_REF_NAME:-main}"

        git fetch origin "$BRANCH"
        git rebase "origin/$BRANCH"
      shell: bash

    - name: Prepare tag branch worktree
      id: tag-branch
      if: ${{ inputs.tag-branch != '' }}
      env:
        TAG_BRANCH: ${{ inputs.tag-branch }}
        TAG_WORKTREE: ${{ runner.temp }}/gitversion-tag-branch
      run: |
        git fetch origin "$TAG_BRANCH"
        git worktree add --detach "$TAG_WORKTREE" FETCH_HEAD
        echo "path=$TAG_WORKTREE" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0
      with:
        useConfigFile: true
        targetPath: ${{ steps.tag-branch.outputs.path }}

    - name: Remove tag branch worktree
      if: ${{ always() && inputs.tag-branch != '' }}
      env:
        TAG_WORKTREE: ${{ runner.temp }}/gitversion-tag-branch
      run: |
        if [[ -d "$TAG_WORKTREE" ]]; then
          git worktree remove --force "$TAG_WORKTREE"
        fi
      shell: bash

    - name: Update package file versions
      run: |
        php -r '
          include "${{ github.action_path }}/php/PackageVersionManager.php";

          $packageVersionManager = new PackageVersionManager(
              "${{ steps.gitversion.outputs.semVer }}"
          );

          $packageVersionManager->updatePackageFiles();
        '
      shell: bash

    - name: Commit package file versions
      run: |
        BRANCH="${GITHUB_REF_NAME:-main}"

        git config --local user.email "ci@github.com"
        git config --local user.name "GitHub Action"
        git add .

        if git diff --cached --quiet; then
          echo "No package version changes detected."
          exit 0
        fi

        git commit \
          -m "build: update package file versions to ${{ steps.gitversion.outputs.semVer }}"

        git push origin "HEAD:$BRANCH"
      shell: bash

    - uses: ncipollo/release-action@v1
      if: ${{ inputs.skip-release == 'false' }}
      with:
        generateReleaseNotes: true
        tag: ${{ steps.gitversion.outputs.semVer }}
